name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Go API ──────────────────────────────────────────────────────────────────
  api:
    name: API — vet, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux go build -o /dev/null ./cmd/server

  # ── React frontend ──────────────────────────────────────────────────────────
  web:
    name: Web — lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Biome check
        run: npm run check

      - name: Test
        run: npm test -- --watchAll=false --watchman=false

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build
        env:
          REACT_APP_API_URL: https://placeholder.onrender.com
          REACT_APP_FRONTEND_URL: https://placeholder.onrender.com
          CI: "false" # CRA treats all warnings as errors when CI=true

  # ── Docker image smoke test ─────────────────────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [api, web]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API image (production target)
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/backend.Dockerfile
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image (production target)
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/frontend.Dockerfile
          target: production
          push: false
          build-args: |
            REACT_APP_API_URL=https://placeholder.onrender.com
            REACT_APP_FRONTEND_URL=https://placeholder.onrender.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate nginx template
        run: |
          docker run --rm \
            -e API_BACKEND_URL=https://placeholder.onrender.com \
            $(docker build -q \
              --target production \
              --build-arg REACT_APP_API_URL=https://placeholder.onrender.com \
              --build-arg REACT_APP_FRONTEND_URL=https://placeholder.onrender.com \
              -f apps/web/frontend.Dockerfile apps/web) \
            nginx -t
